[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:php-fpm]
command=/usr/local/sbin/php-fpm -F
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:queue-worker]
command=/bin/bash -lc 'if [ "${ENABLE_QUEUE_WORKER:-true}" != "true" ]; then echo "queue worker disabled"; exec sleep infinity; fi; exec php /var/www/html/artisan queue:work ${QUEUE_CONNECTION:-database} --queue=${QUEUE_WORKER_QUEUES:-default,broadcastable} --sleep=${QUEUE_WORKER_SLEEP:-3} --tries=${QUEUE_WORKER_TRIES:-3} --timeout=${QUEUE_WORKER_TIMEOUT:-120} --max-time=${QUEUE_WORKER_MAX_TIME:-3600} --no-interaction'
autostart=true
autorestart=true
priority=30
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
command=/bin/bash -lc 'if [ "${ENABLE_SCHEDULER:-true}" != "true" ]; then echo "scheduler disabled"; exec sleep infinity; fi; exec php /var/www/html/artisan schedule:work --run-output-file=/dev/stdout --no-interaction'
autostart=true
autorestart=true
priority=40
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
